<h1 class=sr-only>BG 룰렛 - 블루개러지 랜덤 추첨기</h1>
<div id=settings class=settings>
  <div class=right>
    <button id=btnToggleSettings class=btn-toggle-settings>
      <span data-trans>Settings</span>
      <i class=toggle-arrow>▲</i>
    </button>
    <div class="collapsed collapsible-rows">
      <div class=row>
        <label for=sltMap>
          <i class="icon map"></i>
          <span data-trans>Map</span>
        </label>
        <div class=map-picker>
          <select id=sltMap></select>
          <button id=btnRemoveMap class=btn-map-action type=button hidden title="Remove this map" data-trans=title>✕</button>
        </div>
      </div>
      <div class="row row-toggles">
        <div class=toggle-item>
          <label for=chkAutoRecording>
            <i class="icon record"></i>
            <span data-trans>Recording</span>
          </label>
          <input type=checkbox id=chkAutoRecording>
        </div>
        <div class=toggle-item>
          <label for=chkSkill>
            <i class="bomb icon"></i>
            <span data-trans>Using skills</span>
          </label>
          <input type=checkbox id=chkSkill checked>
        </div>
      </div>
      <div class=row>
        <label>
          <i class="icon trophy"></i>
          <span data-trans>The winner is</span>
        </label>
        <div class=btn-group>
          <button class="active btn-first-winner btn-winner" data-trans>First</button>
          <button class="btn-last-winner btn-winner" data-trans>Last</button>
          <input type=number id=in_winningRank value=1 min=1>
          <button class="btn-multi-winner btn-winner" data-trans>Multiple</button>
        </div>
      </div>
      <div class="row row-range">
        <label></label>
        <div class="btn-group range-group">
          <input type=number id=in_rangeStart value=1 min=1>
          <span class=range-sep>~</span>
          <input type=number id=in_rangeEnd value=3 min=1>
        </div>
      </div>
      <div class=row>
        <label title="Sharper rendering. Ultra may be heavy on 4K screens, especially while recording." data-trans=title>
          <i class="display icon"></i>
          <span data-trans>Resolution</span>
        </label>
        <div class="btn-group resolution-group">
          <button class=btn-resolution data-resolution=default data-trans>Default</button>
          <button class=btn-resolution data-resolution=high>High</button>
          <button class=btn-resolution data-resolution=ultra>Ultra</button>
        </div>
      </div>
    </div>
  </div>
  <div class=left>
    <img class=brand-logo src=/bg-roulette/bg-logo-white.dd134e84.png alt="BLUE GARAGE">
    <h3 data-trans>Enter names below</h3>
    <textarea id=in_names placeholder="Input names separated by commas or line feed here" data-trans=placeholder>수박*2,키위*2,귤*2</textarea>
    <div class=actions>
      <button id=btnNotice>
        <i class="icon megaphone"></i>
      </button>
      <div class=sep></div>
      <button id=btnShuffle>
        <i class="icon shuffle"></i>
        <span data-trans>Shuffle</span>
      </button>
      <button id=btnStart>
        <i class="icon play"></i>
        <span data-trans>Start</span>
      </button>
    </div>
  </div>
</div>
<div id=notice>
  <h2>Notice</h2>
  <div class=notice-body>
    <h3>BG 룰렛에 오신 걸 환영합니다</h3>
    <p>
      이름을 쉼표나 줄바꿈으로 구분해 입력하고 <b>Start</b>를 누르면 구슬이 굴러가며 당첨자를 뽑습니다.
    </p>
    <p>
      <b>이름*3</b> 처럼 쓰면 구슬 3개, <b>이름/2</b> 처럼 쓰면 가중치 2배가 적용됩니다.
    </p>
  </div>
  <div class=notice-action>
    <button id=closeNotice data-trans>Close</button>
  </div>
</div>
